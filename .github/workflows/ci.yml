# Class: tool in Python, or lab (uv or pip projects with ruff and pytest).
# Copy to .github/workflows/ci.yml in the repo.
#
# The pin after "@" must be a full 40-character commit SHA of alawein/.github.
# To update it: find the new SHA (gh api repos/alawein/.github/commits/main --jq .sha),
# replace all pins in this file at once, and open a PR. Steps are in docs/ci.md, "Bump a pin".
#
# Required checks for the ruleset: markdown-lint, link-check, actionlint, pr-title, python-ci

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0

  run-pr-title:
    permissions:
      pull-requests: read
    uses: alawein/.github/.github/workflows/pr-title.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0

  run-python-ci:
    uses: alawein/.github/.github/workflows/python-ci.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0
    with:
      python-version: "3.13"
      installer: uv

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      # Only the actual main-push event may omit PR-title evaluation.
      - name: Require success or eligible main-push skip
        env:
          RESULT: ${{ needs.run-pr-title.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [ "$RESULT" = "success" ] || {
            [ "$RESULT" = "skipped" ] && [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]
          }

  python-ci:
    needs: [run-python-ci]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-python-ci.result }}
        run: test "$RESULT" = "success"


  product-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.5"
      - run: uv sync --frozen
      - run: uv run python --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pyright src
      - run: uv run pytest
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python -m build --no-isolation
      - run: uv run twine check dist/*
      - name: Report dependency audit
        continue-on-error: true
        run: uv run pip-audit --local

  viewer-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.5"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: npm
      - run: uv sync --frozen
      - run: uv run python --version
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      - run: node --test design-tokens/tokens.test.mjs
      - run: uv run python scripts/build_demo.py
      - run: uv run python scripts/build_state_demo.py
      - run: uv run python scripts/check_perf.py
      - run: npm test
      - run: npm run perf
      - run: npm run lhci
      - run: make bench
      - run: uv run --with mlcroissant==1.1.1 python scripts/check_croissant.py
      - name: Report browser development dependency audit
        continue-on-error: true
        run: npm audit --json
