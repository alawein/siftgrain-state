[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "siftgrain-state"
version = "0.5.0.dev0"
description = "Compare requested outcomes with supplied state evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/alawein/siftgrain-state#readme"
Repository = "https://github.com/alawein/siftgrain-state"
Issues = "https://github.com/alawein/siftgrain-state/issues"

[project.optional-dependencies]
signing = ["cryptography>=44"]

[project.scripts]
outcome-check = "siftgrain_state.cli:main"
outcome-convert = "siftgrain_state.convert:main"
outcome-check-mcp = "siftgrain_state.mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "hypothesis>=6",
    "jsonschema>=4",
    "mypy>=1",
    "cryptography>=44",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pip-audit>=2.10.1",
    "rfc8785==0.1.4",
    "hatchling==1.32.4",
    "pyright==1.1.408",
    "pypi-attestations==0.0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/siftgrain_state"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: needs the network or takes more than a few seconds"]

[tool.mypy]
check_untyped_defs = true
